<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Method</title>
<meta name="description" content="Bounce and reversal setups: live scores, open scenarios, your playbook and your best trades replayed.">
<meta name="theme-color" content="#060708">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Opaque, not black-translucent: on iOS 26 a translucent status bar leaves the home-screen
     app's viewport short by the top inset, so the tab bar floats ~59pt above the bottom. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Method">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="/static/icons/favicon-180.png">
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bounce" viewBox="0 0 24 24"><path d="M3 6l5.5 9 3.5-4 3 3.5L21 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-reversal" viewBox="0 0 24 24"><path d="M3 18l5.5-9 3.5 4 3-3.5L21 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 4h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-playbook" viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3zM5 16.5a3 3 0 0 1 3-3h10.5M9 8h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-best" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 16.9l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="app" class="app" data-route="bounce" data-view="list">
  <aside class="rail" aria-label="Main">
    <a class="brand" href="#/bounce" aria-label="Method home"><img class="glyph" src="/static/icons/mark.png" alt=""><span class="wordmark">Method</span></a>
    <nav class="rail-nav">
      <a href="#/bounce" data-nav="bounce"><svg><use href="#i-bounce"/></svg><span>Bounce</span><b class="count" data-count="bounce" hidden></b></a>
      <a href="#/reversal" data-nav="reversal"><svg><use href="#i-reversal"/></svg><span>Reversal</span><b class="count" data-count="reversal" hidden></b></a>
      <a href="#/playbook" data-nav="playbook"><svg><use href="#i-playbook"/></svg><span>Playbook</span></a>
      <a href="#/history" data-nav="history"><svg><use href="#i-history"/></svg><span>History</span></a>
      <a href="#/best" data-nav="best"><svg><use href="#i-best"/></svg><span>Best</span></a>
    </nav>
    <div class="rail-status"><span class="dot" data-dot></span><span data-status-short>Connecting…</span></div>
  </aside>

  <main class="main">
    <section class="pane pane-list" aria-label="List">
      <header class="topbar phone-only">
        <a class="brand" href="#/bounce"><img class="glyph" src="/static/icons/mark.png" alt=""><span class="wordmark">Method</span></a>
        <span class="status-pill"><span class="dot" data-dot></span><span data-status-short>…</span></span>
      </header>
      <div class="scroll" id="list"></div>
    </section>
    <section class="pane pane-detail" aria-label="Detail">
      <header class="topbar detail-bar">
        <button class="icon-btn back" data-back aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <div class="title-block"><h1 id="d-title"></h1><small id="d-sub"></small></div>
      </header>
      <div class="scroll" id="reader"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Tabs">
    <a href="#/bounce" data-nav="bounce"><svg><use href="#i-bounce"/></svg><span>Bounce</span><b class="count" data-count="bounce" hidden></b></a>
    <a href="#/reversal" data-nav="reversal"><svg><use href="#i-reversal"/></svg><span>Reversal</span><b class="count" data-count="reversal" hidden></b></a>
    <a href="#/playbook" data-nav="playbook"><svg><use href="#i-playbook"/></svg><span>Playbook</span></a>
    <a href="#/history" data-nav="history"><svg><use href="#i-history"/></svg><span>History</span></a>
      <a href="#/best" data-nav="best"><svg><use href="#i-best"/></svg><span>Best</span></a>
  </nav>
</div>
<script src="/static/vendor/lightweight-charts-4.2.0.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
